<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="t d">
<title id="t">Architecture of ood-seat-holds</title>
<desc id="d">A Caller (the Cli, HTTP or a test) and the ScheduledSweeper call the inbound ports HoldSeats, ConfirmHold and ExpireHolds, all implemented by SeatHoldService inside the hexagon of domain and application. The service reads through the SeatStore port, asks the pure SeatTransitions what the next state is using the Clock port, and writes with update, a compare-and-set. InMemorySeatStore and JdbcSeatStore, which talks to PostgreSQL, implement SeatStore, and SystemClock implements Clock. PlainWriteSeatStore is the counter-example and is never wired in. Race drivers run a thousand threads against the ports.</desc>
<style>
