<rect class="svc" x="328" y="176" width="212" height="112" rx="12"/>
<text class="name" x="344" y="208">Inbound ports</text>
<text class="sub" x="344" y="232">HoldSeats</text>
<text class="sub" x="344" y="254">ConfirmHold</text>
<text class="sub" x="344" y="276">ExpireHolds</text>
<rect class="svc" x="616" y="190" width="212" height="84" rx="12"/>
