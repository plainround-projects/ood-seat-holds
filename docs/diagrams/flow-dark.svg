<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="836" viewBox="0 0 1200 836" role="img" aria-labelledby="t d">
<title id="t">One run through ood-seat-holds</title>
<desc id="d">Ada asks to hold s-9. SeatHoldService reads Free from SeatStore, SeatTransitions decides Success(Held(ada, 00:10:00)) as a pure function, and the update compare-and-set wins. Bruno's identical call loses its update, reads again, decides again and is told the seat is held. Ada confirms within ten minutes and the seat becomes Sold. When a confirm and the sweeper meet on one seat only one update can match, so the seat ends Sold or Free, never both.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="835" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="834" rx="16"/>
<text class="title" x="48" y="68">Two customers race for seat s-9, and one wins</text>
<text class="caption" x="48" y="100">Amber rows: Bruno's update loses the compare-and-set, and he is told why. The store, not the domain, settles it.</text>
<rect class="actor" x="420" y="128" width="100" height="48" rx="24"/>
<text class="lane" x="470" y="158" text-anchor="middle">Ada</text>
<rect class="actor" x="550" y="128" width="100" height="48" rx="24"/>
<text class="lane" x="600" y="158" text-anchor="middle">Bruno</text>
<rect class="svc" x="675" y="128" width="190" height="48" rx="10"/>
<text class="lane" x="770" y="158" text-anchor="middle">SeatHoldService</text>
<rect class="svc" x="880" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="940" y="158" text-anchor="middle">SeatStore</text>
<rect class="svc" x="1030" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1090" y="148" text-anchor="middle">Scheduled</text>
<text class="lane" x="1090" y="168" text-anchor="middle">Sweeper</text>
<path class="hair" d="M470 176V688M600 176V624M770 176V752M940 176V752M1090 176V752"/>
<path class="hair" d="M66 216V728"/>
<circle class="dot" cx="66" cy="216" r="15"/>
<text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Ada asks to hold s-9</text>
<text class="sub" x="96" y="232">HoldSeats.hold(s-9, ada)</text>
<path class="sync" d="M470 216H770"/>
<text class="label t-accent" x="620" y="206">hold(s-9)</text>
<circle class="dot" cx="66" cy="280" r="15"/>
<text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">The service reads the seat</text>
<text class="sub" x="96" y="296">SeatStore.get returns Free</text>
<path class="sync" d="M770 280H940"/>
<text class="label t-accent" x="782" y="270">get</text>
<circle class="dot" cx="66" cy="344" r="15"/>
<text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">A pure function decides</text>
<text class="sub" x="96" y="360">Success(Held(ada, 00:10:00))</text>
<rect class="slot" x="764" y="326" width="12" height="36" rx="4"/>
<text class="label t-accent" x="786" y="349">SeatTransitions</text>
<circle class="dot" cx="66" cy="408" r="15"/>
<text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="404">update is a compare-and-set</text>
<text class="sub" x="96" y="424">the first update to arrive wins</text>
<path class="sync" d="M770 408H940"/>
<text class="label t-accent" x="782" y="398">update(s-9)</text>
<circle class="dot" cx="66" cy="472" r="15"/>
<text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="468">Bruno calls hold on s-9</text>
<text class="sub" x="96" y="488">between his read and his write</text>
<path class="sync" d="M600 472H770"/>
<text class="label t-accent" x="612" y="462">hold(s-9)</text>
<circle class="dot-w" cx="66" cy="536" r="15"/>
<text class="num" x="66" y="541" text-anchor="middle">5x</text>
<text class="label b t-warn" x="96" y="532">His update loses</text>
<text class="sub" x="96" y="552">no row matches: returns false</text>
<path class="fail" d="M770 536H940"/>
<text class="label t-warn" x="782" y="526">update: false</text>
<circle class="dot-w" cx="66" cy="600" r="15"/>
<text class="num" x="66" y="605" text-anchor="middle">6</text>
<text class="label b t-warn" x="96" y="596">He reads and decides again</text>
<text class="sub" x="96" y="616">Reason: seat is held</text>
<path class="fail" d="M770 600H600"/>
<text class="label t-warn" x="612" y="590">seat is held</text>
<circle class="dot" cx="66" cy="664" r="15"/>
<text class="num" x="66" y="669" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="660">Ada confirms in time</text>
<text class="sub" x="96" y="680">Held(ada) becomes Sold(ada)</text>
<path class="sync" d="M470 664H770"/>
<text class="label t-accent" x="620" y="654">confirm(s-9)</text>
<circle class="dot-g" cx="66" cy="728" r="15"/>
<text class="num" x="66" y="733" text-anchor="middle">8</text>
<text class="label b t-ink" x="96" y="724">The sweeper meets a confirm</text>
<text class="sub" x="96" y="744">only one update can match</text>
<path class="sync" d="M1090 728H770"/>
<text class="label t-accent" x="1006" y="718">sweep()</text>
<path class="ok" d="M770 728H672"/>
<rect class="win" x="424" y="708" width="248" height="40" rx="10"/>
<text class="label b t-good" x="440" y="733">Sold or Free, never both</text>
<path class="sync" d="M48 792H112"/><text class="legend" x="124" y="797">sync call</text>
<path class="fail" d="M696 792H760"/><text class="legend" x="772" y="797">failure path</text>
<path class="ok" d="M928 792H992"/><text class="legend" x="1004" y="797">result</text>
</svg>
