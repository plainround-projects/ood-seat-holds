<text class="sub" x="940" y="586">infrastructure</text>
<text class="sub" x="940" y="608">the real time</text>
<path class="store" d="M598 662a130 12 0 0 1 260 0v102a130 12 0 0 1 -260 0z"/>
<path class="rim" d="M598 662a130 12 0 0 0 260 0"/>
<text class="name" x="728" y="699" text-anchor="middle">PostgreSQL</text>
