<text class="sub" x="632" y="268">read, decide, write</text>
<rect class="svc" x="924" y="190" width="212" height="84" rx="12"/>
<text class="name" x="940" y="222">SeatTransitions</text>
<text class="sub" x="940" y="246">domain, pure</text>
<text class="sub" x="940" y="268">SeatState, Outcome</text>
<rect class="svc" x="328" y="340" width="212" height="112" rx="12"/>
<text class="name" x="344" y="372">Race drivers</text>
<text class="sub" x="344" y="396">HoldRace</text>
<text class="sub" x="344" y="418">SweepConfirmRace</text>
<text class="sub" x="344" y="440">RendezvousSeatStore</text>
<rect class="svc" x="616" y="340" width="212" height="112" rx="12"/>
<text class="name" x="632" y="372">SeatStore</text>
<text class="sub" x="632" y="396">port: get, add, seats</text>
<text class="sub" x="632" y="418">update is the</text>
<text class="sub" x="632" y="440">compare-and-set</text>
<rect class="svc" x="924" y="340" width="212" height="84" rx="12"/>
<text class="name" x="940" y="372">Clock</text>
<text class="sub" x="940" y="396">port</text>
<text class="sub" x="940" y="418">now()</text>
<rect class="svc" x="328" y="530" width="236" height="84" rx="12"/>
<text class="name" x="344" y="562">InMemorySeatStore</text>
<text class="sub" x="344" y="586">ConcurrentHashMap</text>
<text class="sub" x="344" y="608">replace(key, old, new)</text>
<rect class="svc" x="628" y="530" width="200" height="84" rx="12"/>
<text class="name" x="644" y="562">JdbcSeatStore</text>
<text class="sub" x="644" y="586">conditional UPDATE</text>
<text class="sub" x="644" y="608">Hikari pool</text>
<rect class="svc" x="924" y="530" width="212" height="84" rx="12"/>
