<rect class="paper" x="0.5" y="0.5" width="1199" height="879" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="878" rx="16"/>
<text class="title" x="48" y="68">Sold at most once, because the store decides</text>
<text class="caption" x="48" y="100">The domain has no locks. The guarantee lives in SeatStore.update, which both adapters implement as compare-and-set.</text>
